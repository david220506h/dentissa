# Panel de la DEMO: archivos estáticos y /api hacia el contenedor de la API (sin CORS: mismo origen).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas del panel (React Router): cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
