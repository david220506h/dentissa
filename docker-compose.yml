# PostgreSQL y Mailpit para desarrollo local. No usar en producción (ver docs/database/modelo-datos.md, sección 10).
#
#   1. Copia .env.example como .env y define POSTGRES_PASSWORD (.env no se versiona).
#   2. docker compose up -d
#   3. Configura la cadena de conexión del backend con user-secrets (docs/security-audit.md, sección 3).
services:
  postgres:
    image: postgres:17-alpine
    container_name: dentissa-postgres
    environment:
      POSTGRES_DB: dentissa
      POSTGRES_USER: dentissa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env (copia .env.example)}
    ports:
      # Solo accesible desde este equipo
      # POSTGRES_PORT en .env si el 5432 ya está ocupado (p. ej., por un PostgreSQL instalado en Windows)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dentissa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentissa -d dentissa"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Correo de desarrollo (diseño de la agenda, 7.1): atrapa todo lo que envía el backend; nada sale a internet.
  # Bandeja web en http://127.0.0.1:8025. Configuración del backend: docs/correo/desarrollo.md.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: dentissa-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  dentissa-pgdata:
